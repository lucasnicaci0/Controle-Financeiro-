<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rumo · suas finanças</title>
<meta name="description" content="Controle de gastos e ganhos com um consultor financeiro.">
<meta name="theme-color" content="#05020A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="config.js"></script>
<script src="js/xlsx.js" defer></script>
<style>
:root{
  --bg:#05020A; --ink:#F5F3FF; --mute:#b2a3ee; --line:rgba(167,139,250,.2);
  --glass:rgba(10,5,24,.76); --a:#8B5CF6; --b:#FF4DA6; --c:#22D3EE; --btn1:#A78BFA; --btn2:#FF4DA6;
  --good:#34d399; --warn:#fbbf24; --bad:#fb7185; --r:20px;
}
*{box-sizing:border-box}
html{color-scheme:dark;font-size:calc(15px*var(--fs,1))}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
  font:1rem/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0}
#app{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px 110px}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}

.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 40px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.06)}
.card{padding:calc(20px*var(--dens,1))}
.card h3{margin:0 0 14px;font-size:0.8667rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.mute{color:var(--mute)}
.small{font-size:0.8333rem}

/* entrada animada */
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
.reveal{animation:rise .7s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--i,0)*70ms)}
.tilt{transition:transform .25s ease, box-shadow .25s ease;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));will-change:transform}
.tilt:hover{box-shadow:0 18px 60px rgba(34,211,238,.12), 0 10px 40px rgba(0,0,0,.35)}

/* login */
.login{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px 0}
.login .box{max-width:520px;padding:44px 34px}
.brand{display:inline-flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.02em}
.logo{width:34px;height:34px;border-radius:11px;background:conic-gradient(from 200deg,var(--a),var(--b),var(--c),var(--a));
  box-shadow:0 0 24px rgba(139,92,246,.55);animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.login h1{font-size:clamp(2rem,6vw,3.0667rem);line-height:1.08;margin:22px 0 12px;letter-spacing:-.02em;
  color:var(--ink);text-shadow:0 0 38px rgba(255,77,166,.45),0 0 80px rgba(139,92,246,.5)}
@keyframes shine{to{background-position:100% 0}}
.login p{margin:0 0 26px;color:var(--mute)}
#gbtn{display:flex;justify-content:center;min-height:44px;margin-bottom:14px}

/* topo e navegação */
.top{position:relative;z-index:35;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;margin-top:8px}
.mes{display:flex;align-items:center;gap:6px}
.mes b{min-width:132px;text-align:center;font-weight:600}
.mes b::first-letter{text-transform:uppercase}
.icon{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.05);cursor:pointer;display:grid;place-items:center;transition:.2s}
.icon:hover:not(:disabled){background:rgba(255,255,255,.12);transform:scale(1.08)}
.icon:disabled{opacity:.3;cursor:default}
.user{position:relative}
.avatar{width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;font-weight:700;color:#0B0618;background:linear-gradient(135deg,var(--btn1),var(--btn2))}
.menu{position:absolute;right:0;top:46px;min-width:210px;padding:8px;z-index:40;animation:rise .25s both}
.menu .who{padding:8px 10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:10px;cursor:pointer}
.menu button:hover{background:rgba(255,255,255,.08)}
.navwrap{position:sticky;top:10px;z-index:30;display:flex;justify-content:center;margin:14px 0 18px}
.nav{position:relative;display:flex;gap:2px;padding:5px;overflow-x:auto;max-width:100%;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav button{position:relative;z-index:1;background:none;border:0;padding:9px 16px;border-radius:999px;cursor:pointer;color:var(--mute);white-space:nowrap;transition:color .3s}
.nav button.on{color:var(--ink)}
.ind{position:absolute;top:5px;bottom:5px;border-radius:999px;z-index:0;background:linear-gradient(120deg,rgba(34,211,238,.28),rgba(139,92,246,.3));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 0 24px rgba(139,92,246,.25);transition:left .5s cubic-bezier(.2,.9,.3,1.25),width .5s cubic-bezier(.2,.9,.3,1.25)}

/* grades */
.view{animation:rise .5s both}
.grid{display:grid;gap:calc(16px*var(--dens,1))}
.g-hero{grid-template-columns:1.4fr 1fr 1fr 1fr}
.g-2{grid-template-columns:1.5fr 1fr}
.g-eq{grid-template-columns:1fr 1fr}
.g-cards{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.stack{display:grid;gap:calc(16px*var(--dens,1));margin-top:calc(16px*var(--dens,1))}
@media(max-width:900px){.g-hero,.g-2,.g-eq{grid-template-columns:1fr 1fr}.g-hero .hero{grid-column:1/-1}}
@media(max-width:620px){.g-hero,.g-2,.g-eq{grid-template-columns:1fr}
  .navwrap{position:fixed;bottom:max(12px,env(safe-area-inset-bottom));left:12px;right:12px;top:auto;margin:0}
  .nav{width:100%}.nav button{padding:10px 12px;flex:1}
  .top .brand span:last-child{display:none}.mes b{min-width:0;font-size:0.9333rem;white-space:nowrap}}

.big{font-size:clamp(2.2667rem,5.4vw,3.4667rem);font-weight:700;letter-spacing:-.03em;line-height:1.1;font-variant-numeric:tabular-nums}
.stat{font-size:1.7333rem;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pos{color:var(--good)}.neg{color:var(--bad)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .sem{text-align:center;font-size:.75rem;color:var(--mute);padding:4px 0}
.dia{aspect-ratio:1/1;min-height:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.04);border-radius:12px;color:inherit;cursor:pointer;font:inherit;padding:2px}
.dia.vazio{border:0;background:none;cursor:default}.dia.hoje{border-color:#22D3EE}.dia.sel{background:rgba(139,92,246,.35);border-color:#8B5CF6}
.dia .pts{display:flex;gap:3px;min-height:6px}.dia .pts i{width:6px;height:6px;border-radius:50%}.dia .pts i.ok{opacity:.35}
.item.ag.feito .t b{text-decoration:line-through;opacity:.6}
.ck{width:28px;height:28px;border-radius:8px;border:2px solid rgba(255,255,255,.4);background:none;color:#05020A;cursor:pointer;font-weight:700;flex:none}.ck.on{background:#22D3EE;border-color:#22D3EE}
.lim{padding:12px 0;border-bottom:1px solid rgba(255,255,255,.07)}.lim .row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.lim-barra{position:relative;height:12px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-bottom:6px}.lim-barra i{display:block;height:100%;border-radius:99px;transition:width .6s}
.lim-barra u{position:absolute;top:0;bottom:0;width:2px;background:rgba(255,255,255,.55)}
.dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:12px 0}.dl dt{color:var(--mute);font-size:.85rem}.dl dd{margin:0;text-align:right;font-weight:600}
.cartao .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
/* tema claro (só nas telas internas; a Jornada 3D continua escura) */
html[data-tema=claro]{color-scheme:light}
html[data-tema=claro] body.in-app{--bg:#F4F1FF;--ink:#1B1033;--mute:#51437F;--line:rgba(81,67,127,.28);--glass:rgba(255,255,255,.88);--good:#047857;--warn:#92400e;--bad:#be123c;background:var(--bg)}
html[data-tema=claro] body.in-app #fx,html[data-tema=claro] body.in-app canvas{opacity:0!important;pointer-events:none}
html[data-tema=claro] body.in-app .glass{box-shadow:0 8px 30px rgba(60,30,140,.12)}
html[data-tema=claro] body.in-app input,html[data-tema=claro] body.in-app select{background:#fff;color:var(--ink)}
html[data-tema=claro] body.in-app select option{background:#fff;color:#1B1033}
html[data-tema=claro] body.in-app .chip,html[data-tema=claro] body.in-app .btn.ghost,html[data-tema=claro] body.in-app .seg,html[data-tema=claro] body.in-app .dia,html[data-tema=claro] body.in-app .ico-grade button{background:rgba(81,67,127,.1)}
html[data-tema=claro] body.in-app .seg button.on{color:#0B0618}
html[data-tema=claro] body.in-app .lim-barra,html[data-tema=claro] body.in-app .ck{background:rgba(81,67,127,.15);border-color:rgba(81,67,127,.45)}
html[data-tema=claro] body.in-app .item:hover{background:rgba(81,67,127,.08)}
html[data-tema=claro] body.in-app .tags em{color:#3b1d8f;background:rgba(139,92,246,.18)}
html[data-tema=claro] body.in-app .login h1{text-shadow:none}
.avatar.grande{width:84px;height:84px;font-size:2rem;display:grid;place-items:center;flex:none}.foto-linha{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
dialog.crop{margin:auto;padding:20px;color:var(--ink);max-width:min(360px,94vw)}dialog.crop::backdrop{background:rgba(0,0,0,.65)}
.crop-box{position:relative;width:min(280px,100%);margin:0 auto;aspect-ratio:1}.crop-cv{width:100%;height:100%;display:block;touch-action:none;cursor:grab;border-radius:12px}
.crop-mask{position:absolute;inset:0;border-radius:12px;pointer-events:none;box-shadow:inset 0 0 0 2px rgba(255,255,255,.6);background:radial-gradient(circle,transparent 62%,rgba(0,0,0,.55) 63%)}
.faq details{border-bottom:1px solid var(--line);padding:10px 0}.faq summary{cursor:pointer;font-weight:600}.faq details p{margin:8px 0 0;color:var(--mute)}
textarea{width:100%;padding:11px 13px;border-radius:var(--rb,13px);border:1px solid var(--line);background:rgba(11,6,24,.6);font:inherit;color:inherit;resize:vertical}
html[data-tema=claro] body.in-app textarea{background:#fff;color:var(--ink)}
.cb-wrap{position:relative}.cb-sug{list-style:none;margin:6px 0 0;padding:6px;position:absolute;left:0;right:0;z-index:30;background:var(--bg);border:1px solid var(--line);border-radius:var(--rb,13px);box-shadow:0 14px 40px rgba(0,0,0,.4);max-height:300px;overflow:auto}
.cb-sug li{padding:10px 12px;border-radius:10px;cursor:pointer}.cb-sug li.on,.cb-sug li:hover{background:rgba(139,92,246,.28)}
.cb-favs{margin:16px 0}.cb-fav{display:flex;flex-direction:column;gap:2px;text-align:left;cursor:pointer;color:inherit;font:inherit}.cb-fav.on{outline:2px solid var(--a)}.cb-fav b{font-size:1.1rem}.cb-v{font-size:1.25rem;font-weight:700}
.cb-det .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}.cb-pares{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}.cb-linha{margin:4px 0}
.cb-graf{position:relative}.cb-graf svg .eixo{fill:var(--mute);font-size:11px}.cb-tip{position:absolute;top:0;transform:translateX(-50%);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:.8rem;pointer-events:none;white-space:nowrap}
.cb-conv{display:grid;grid-template-columns:1fr 1fr auto 1fr;gap:12px;align-items:end}@media(max-width:640px){.cb-conv{grid-template-columns:1fr 1fr}.cb-conv>:first-child{grid-column:1/-1}.cb-conv .btn{justify-self:start}}
.cb-res{font-size:1.8rem;font-weight:700;margin:14px 0 4px}.skel{background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.12),rgba(255,255,255,.05));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:12px}@keyframes sk{to{background-position:-200% 0}}
.cat-ico{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:12px;border:1px solid;font-size:1.2rem;flex:none}
.cat-ico.grande{width:52px;height:52px;font-size:1.6rem}
.item.arq{opacity:.6}
.btn.mini{padding:6px 10px;font-size:.8rem}
.ico-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.ico-grade button{border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.05);border-radius:10px;padding:6px;font-size:1.2rem;cursor:pointer}
.ico-grade button.on{border-color:var(--ciano,#22D3EE);background:rgba(34,211,238,.18)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.tags em{font-style:normal;font-size:.72rem;padding:1px 8px;border-radius:999px;background:rgba(139,92,246,.22);color:#e4dbff}
.planos{position:relative;z-index:6;max-width:1000px;margin:0 auto;padding:40px 16px 90px}
.planos h2{text-align:center;margin:0 0 12px}.planos .seg{margin:0 auto 18px;display:flex;width:fit-content}
.planos-grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.plano.destaque{outline:2px solid #8B5CF6}.plano .preco{font-size:1.8rem;font-weight:700}.plano .preco small{font-size:.9rem;font-weight:400;color:var(--mute)}
.plano ul{padding-left:18px;margin:12px 0}.aviso-ex{color:#fbbf24}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:rgba(255,255,255,.07);font-size:0.8rem}
.dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor}

/* formulários */
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-items:end}
.campo{display:grid;gap:5px}
.campo span{font-size:0.8rem;color:var(--mute)}
input,select{width:100%;padding:11px 13px;border-radius:var(--rb,13px);border:1px solid var(--line);background:rgba(11,6,24,.6);transition:border .2s, box-shadow .2s}
input:focus,select:focus{border-color:var(--a);box-shadow:0 0 0 3px rgba(34,211,238,.15);outline:0}
select option{background:#0B0618}
input[type=color]{padding:3px;height:44px}
.btn{position:relative;overflow:hidden;border:0;border-radius:var(--rb,13px);padding:11px 18px;cursor:pointer;font-weight:600;color:#0B0618;
  background:linear-gradient(120deg,var(--btn1),var(--btn2));box-shadow:0 8px 26px rgba(34,211,238,.22);transition:transform .2s, box-shadow .2s, filter .2s}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 14px 34px rgba(139,92,246,.35)}
.btn:active:not(:disabled){transform:scale(.97)}
.btn:disabled{opacity:.5;cursor:wait}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--ink);box-shadow:none}
.btn.danger{background:linear-gradient(120deg,#fb7185,#FF4DA6);color:#220510}
.seg{display:inline-flex;padding:4px;border-radius:var(--rb,13px);background:rgba(255,255,255,.06);gap:4px}
.seg button{border:0;background:none;padding:8px 16px;border-radius:10px;cursor:pointer;color:var(--mute);transition:.25s}
.seg button.on{color:#0B0618;background:linear-gradient(120deg,var(--btn1),var(--btn2))}
.seg button.on.out{background:linear-gradient(120deg,var(--c),#fb7185)}

/* listas */
.lista{display:grid;gap:4px}
.item{display:flex;align-items:center;gap:12px;padding:calc(11px*var(--dens,1)) 12px;border-radius:14px;transition:background .2s, transform .2s;animation:rise .5s both;animation-delay:calc(var(--i,0)*35ms)}
.item:hover{background:rgba(255,255,255,.06);transform:translateX(3px)}
.item .t{flex:1;min-width:0}
.item .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.item .v{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.x{border:0;background:none;color:var(--mute);cursor:pointer;font-size:1.2rem;line-height:1;padding:4px 8px;border-radius:8px;transition:.2s}
.x:hover{color:var(--bad);background:rgba(251,113,133,.12)}
.vazio{padding:28px;text-align:center;color:var(--mute)}

/* barras, gráficos */
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--a),var(--b));transition:width 1.1s cubic-bezier(.2,.9,.3,1)}
.bar i.warn{background:linear-gradient(90deg,var(--warn),#fb923c)}
.bar i.bad{background:linear-gradient(90deg,var(--bad),var(--c))}
.orcs{display:grid;gap:14px}
.orcs .row{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px}
.bar-grow{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,.9,.3,1) both;animation-delay:calc(var(--d,0)*70ms)}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
svg text{fill:var(--mute);font-size:0.7333rem}
.legenda{display:grid;gap:8px;margin-top:6px}
.legenda div{display:flex;align-items:center;gap:8px}
.legenda b{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:600}
.donut{display:grid;grid-template-columns:150px 1fr;gap:14px;align-items:center}
@media(max-width:420px){.donut{grid-template-columns:1fr}}
.ring circle{transition:stroke-dasharray 1.2s cubic-bezier(.2,.9,.3,1)}

/* consultor */
.orbbox{display:grid;place-items:center;padding:10px 0 4px}
.orb{width:150px;height:150px;border-radius:50%;position:relative;
  background:radial-gradient(circle at 30% 28%,rgba(255,255,255,.75),transparent 38%),conic-gradient(from 0deg,var(--a),var(--b),var(--c),var(--a));
  box-shadow:0 0 70px rgba(139,92,246,.55),inset 0 0 40px rgba(255,255,255,.18);animation:spin 10s linear infinite,breathe 4.5s ease-in-out infinite}
.orb::after{content:"";position:absolute;inset:-18px;border-radius:50%;border:1px solid rgba(255,255,255,.14);animation:ping 3.2s ease-out infinite}
.orb.thinking{animation-duration:1.6s,1.2s}
@keyframes breathe{50%{transform:scale(1.07)}}
@keyframes ping{from{transform:scale(.85);opacity:.9}to{transform:scale(1.5);opacity:0}}
.dica{display:flex;gap:12px;padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.05);border-left:3px solid var(--mute);animation:rise .6s both;animation-delay:calc(var(--i,0)*90ms)}
.dica.alerta{border-color:var(--bad);background:rgba(251,113,133,.08)}
.dica.atencao{border-color:var(--warn);background:rgba(251,191,36,.07)}
.dica.ok{border-color:var(--good);background:rgba(52,211,153,.07)}
.dica.dica{border-color:var(--b)}
.dica b{display:block;margin-bottom:2px}
.dica .ico{font-size:1.2rem;line-height:1.3}

/* diversos */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips .chip button{border:0;background:none;cursor:pointer;color:var(--mute);padding:0 0 0 4px}
.meta .ring{margin:0 auto 8px;display:block}
.meta{text-align:center;padding:20px}
.meta .acoes{display:flex;gap:8px;justify-content:center;margin-top:12px}
.meta .acoes .btn{padding:7px 12px;font-size:0.8667rem}
#toasts{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);z-index:99;display:grid;gap:8px;width:min(92vw,420px);pointer-events:none}
.toast{padding:12px 16px;border-radius:14px;background:rgba(18,10,38,.94);border:1px solid var(--line);box-shadow:0 12px 40px rgba(0,0,0,.5);animation:rise .35s both}
.toast.erro{border-color:var(--bad)}
.toast.ok{border-color:var(--good)}
.skel{height:96px;border-radius:var(--r);background:linear-gradient(100deg,rgba(255,255,255,.04) 30%,rgba(255,255,255,.12) 50%,rgba(255,255,255,.04) 70%);background-size:200% 100%;animation:sk 1.3s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.aviso{margin-top:22px;text-align:center;font-size:0.8rem;color:var(--mute)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){

<script>
'use strict';
/* =====================================================================
   CONFIGURAÇÃO — troque os dois valores abaixo depois de publicar o
   Apps Script (URL que termina em /exec) e criar o ID de cliente OAuth.
   Enquanto estiverem com "COLE_AQUI", o site abre só em modo demonstração.
   ===================================================================== */
const CONFIG = {
  API_URL:   'COLE_AQUI_A_URL_EXEC',
  CLIENT_ID: 'COLE_AQUI_O_ID_DO_CLIENTE_OAUTH'
};
// config.js (editável) tem prioridade quando preenchido
(function () { const c = window.RUMO_CONFIG || {}; if (c.API_URL) CONFIG.API_URL = c.API_URL; if (c.CLIENT_ID) CONFIG.CLIENT_ID = c.CLIENT_ID; })();

/*PURE_START*/
const TZ = 'America/Sao_Paulo';
const hojeISO = () => new Date().toLocaleDateString('sv-SE', { timeZone: TZ });
const mesAtual = () => hojeISO().slice(0, 7);
function somarMes(m, k) {
  const p = m.split('-').map(Number), d = new Date(Date.UTC(p[0], p[1] - 1 + k, 1));
  return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0');
}
function dataValida(y, m, d) {
  const dt = new Date(Date.UTC(y, m - 1, d));
  return dt.getUTCFullYear() === y && dt.getUTCMonth() === m - 1 && dt.getUTCDate() === d;
}
// "1.234,56" · "12,5" · "-12.50" · "R$ 3.000" -> número (ou NaN)
function parseValor(s) {
  let t = String(s == null ? '' : s).replace(/R\$|\s/g, '');
  if (!t) return NaN;
  if (t.includes(',')) t = t.replace(/\./g, '').replace(',', '.');
  else if (/^-?\d{1,3}(\.\d{3})+$/.test(t)) t = t.replace(/\./g, '');
  const n = Number(t);
  return isFinite(n) ? n : NaN;
}
// "2026-11-05" · "05/11/2026" · "5-11-26" -> "2026-11-05" (ou '')
function parseData(s) {
  const t = String(s || '').trim();
  let m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
  let y, mo, d;
  if (m) { y = +m[1]; mo = +m[2]; d = +m[3]; }
  else {
    m = t.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
    if (!m) return '';
    d = +m[1]; mo = +m[2]; y = +m[3]; if (y < 100) y += 2000;
  }
  return dataValida(y, mo, d) ? y + '-' + String(mo).padStart(2, '0') + '-' + String(d).padStart(2, '0') : '';
}
function parseCSV(txt) {
  txt = String(txt || '').replace(/^﻿/, '');
  const primeira = txt.split(/\r?\n/).find(l => l.trim()) || '';
  const cnt = ch => primeira.split(ch).length - 1;
  const c = { ';': cnt(';'), ',': cnt(','), '\t': cnt('\t') };
  let delim = Object.keys(c).sort((a, b) => c[b] - c[a])[0];
  if (!c[delim]) delim = ',';
  const rows = []; let row = [], cell = '', q = false;
  const fim = () => { row.push(cell); cell = ''; if (row.some(x => x.trim() !== '')) rows.push(row); row = []; };
  for (let i = 0; i < txt.length; i++) {
    const ch = txt[i];
    if (q) { if (ch === '"') { if (txt[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += ch; }
    else if (ch === '"') q = true;
    else if (ch === delim) { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') { if (ch === '\r' && txt[i + 1] === '\n') i++; fim(); }
    else cell += ch;
  }
  if (cell !== '' || row.length) fim();
  return rows;
}
const semAcento = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
// Converte linhas de CSV em lançamentos. Valor negativo = despesa; positivo = receita.
function mapearLinhas(rows) {
  if (!rows.length) return { linhas: [], erros: 0 };
  let ci = { data: 0, desc: 1, valor: 2, tipo: -1 }, inicio = 0;
  const cab = rows[0].map(semAcento);
  const temCab = !cab.some(c => parseData(c)) && cab.some(c => /data|date|valor|amount|value|desc|hist/.test(c));
  if (temCab) {
    inicio = 1;
    const acha = re => cab.findIndex(c => re.test(c));
    ci = { data: acha(/data|date/), desc: acha(/desc|hist|memo|estab|lanc|detalh/), valor: acha(/valor|amount|value/), tipo: acha(/^tipo|type|d\/c/) };
    if (ci.data < 0 || ci.valor < 0) return { linhas: [], erros: rows.length - 1, semColunas: true };
  }
  const linhas = []; let erros = 0;
  for (let i = inicio; i < rows.length; i++) {
    const r = rows[i];
    const data = parseData(r[ci.data]), v = parseValor(r[ci.valor]);
    if (!data || !isFinite(v) || v === 0) { erros++; continue; }
    let tipo = v < 0 ? 'despesa' : 'receita';
    if (ci.tipo >= 0) {
      const t = semAcento(r[ci.tipo]);
      if (/deb|desp|saida|^d$/.test(t)) tipo = 'despesa';
      else if (/cred|rece|entrada|^c$/.test(t)) tipo = 'receita';
    }
    linhas.push({ data, tipo, valor: Math.abs(v), descricao: String(ci.desc >= 0 ? r[ci.desc] : '').trim().slice(0, 120) });
  }
  return { linhas, erros };
}
/*PURE_END*/

/* ======================= utilidades de interface ======================= */
const $ = (s, r = document) => r.querySelector(s);
const BRL = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
const brl = n => BRL.format(n || 0);
const reduz = matchMedia('(prefers-reduced-motion: reduce)').matches;
const mesNome = (m, longo) => {
  const p = m.split('-').map(Number);
  return new Date(Date.UTC(p[0], p[1] - 1, 1)).toLocaleDateString('pt-BR', { month: longo ? 'long' : 'short', year: longo ? 'numeric' : undefined, timeZone: 'UTC' }).replace('.', '');
};
const dataBR = d => d.slice(8, 10) + '/' + d.slice(5, 7);

function el(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const k in (props || {})) {
    const v = props[k];
    if (v === false || v == null) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style') e.style.cssText = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else e.setAttribute(k, v === true ? '' : v);
  }
  kids.flat(2).forEach(c => { if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return e;
}
const NS = 'http://www.w3.org/2000/svg';
function sv(tag, props, ...kids) {
  const e = document.createElementNS(NS, tag);
  for (const k in (props || {})) { if (props[k] != null && props[k] !== false) e.setAttribute(k, props[k]); }
  kids.flat(2).forEach(c => { if (c != null) e.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return e;
}
const campo = (txt, inp, cls) => el('label', { class: 'campo ' + (cls || '') }, el('span', null, txt), inp);
const selecao = (ops, val) => { const s = el('select'); ops.forEach(o => s.append(el('option', { value: o.v, selected: o.v === val }, o.t))); return s; };

function toast(msg, tipo) {
  const t = el('div', { class: 'toast ' + (tipo || '') }, msg);
  $('#toasts').append(t);
  setTimeout(() => { t.style.transition = 'opacity .4s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 450); }, 3400);
}

function contar(no, ate, fmt) {
  if (reduz) { no.textContent = fmt(ate); return; }
  const ini = performance.now(), dur = 1000;
  (function passo(t) {
    const p = Math.min(1, (t - ini) / dur), e = 1 - Math.pow(1 - p, 4);
    no.textContent = fmt(ate * e);
    if (p < 1) requestAnimationFrame(passo);
  })(ini);
}
function animar(raiz) {
  raiz.querySelectorAll('.reveal').forEach((n, i) => n.style.setProperty('--i', i));
  raiz.querySelectorAll('[data-count]').forEach(n => contar(n, Number(n.dataset.count), brl));
  const barras = raiz.querySelectorAll('.bar i[data-w]');
  requestAnimationFrame(() => requestAnimationFrame(() => barras.forEach(b => { b.style.width = b.dataset.w + '%'; })));
  raiz.querySelectorAll('.ring circle[data-d]').forEach(c => requestAnimationFrame(() => requestAnimationFrame(() => { c.style.strokeDasharray = c.dataset.d; })));
}
const esqueleto = () => el('div', { class: 'stack' }, el('div', { class: 'skel' }), el('div', { class: 'skel' }), el('div', { class: 'skel' }));

/* ======================= fundo animado ======================= */
(function fundo() {
  const c = $('#fx'), g = c.getContext('2d');
  let W, H, dpr, t = 0, parts = [], rodando = true;
  const mouse = { x: -999, y: -999 };
  const blobs = [
    { c: '94,234,212', x: .18, y: .22, r: .5, v: .00021, f: 0 },
    { c: '129,140,248', x: .82, y: .3, r: .55, v: .00017, f: 2 },
    { c: '244,114,182', x: .5, y: .88, r: .5, v: .00024, f: 4 }
  ];
  function tamanho() {
    dpr = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    c.width = W * dpr; c.height = H * dpr; g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(Math.min(80, W * H / 18000));
    parts = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .3, vy: (Math.random() - .5) * .3, r: Math.random() * 1.6 + .6 }));
  }
  function quadro() {
    g.fillStyle = '#05020A'; g.fillRect(0, 0, W, H);
    blobs.forEach(b => {
      const x = (b.x + .14 * Math.sin(t * b.v + b.f)) * W, y = (b.y + .12 * Math.cos(t * b.v * 1.3 + b.f)) * H, r = b.r * Math.max(W, H) * .6;
      const gr = g.createRadialGradient(x, y, 0, x, y, r);
      gr.addColorStop(0, 'rgba(' + b.c + ',.20)'); gr.addColorStop(1, 'rgba(' + b.c + ',0)');
      g.fillStyle = gr; g.fillRect(0, 0, W, H);
    });
    for (let i = 0; i < parts.length; i++) {
      const p = parts[i];
      if (!reduz) {
        const dx = mouse.x - p.x, dy = mouse.y - p.y, d = Math.hypot(dx, dy);
        if (d < 170 && d > 1) { p.vx += dx / d * .012; p.vy += dy / d * .012; }
        p.vx *= .995; p.vy *= .995; p.x += p.vx; p.y += p.vy;
        if (p.x < -10) p.x = W + 10; else if (p.x > W + 10) p.x = -10;
        if (p.y < -10) p.y = H + 10; else if (p.y > H + 10) p.y = -10;
      }
      g.fillStyle = 'rgba(200,220,255,.55)'; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 6.2832); g.fill();
      for (let j = i + 1; j < parts.length; j++) {
        const q = parts[j], d = Math.hypot(p.x - q.x, p.y - q.y);
        if (d < 110) { g.strokeStyle = 'rgba(160,190,255,' + (.16 * (1 - d / 110)) + ')'; g.lineWidth = 1; g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(q.x, q.y); g.stroke(); }
      }
      const dm = Math.hypot(p.x - mouse.x, p.y - mouse.y);
      if (dm < 170) { g.strokeStyle = 'rgba(34,211,238,' + (.5 * (1 - dm / 170)) + ')'; g.beginPath(); g.moveTo(p.x, p.y); g.lineTo(mouse.x, mouse.y); g.stroke(); }
    }
  }
  function laco(ts) { t = ts; if (rodando && !c.hidden) quadro(); requestAnimationFrame(laco); }
  addEventListener('resize', () => { tamanho(); quadro(); });
  addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; }, { passive: true });
  addEventListener('pointerleave', () => { mouse.x = mouse.y = -999; });
  document.addEventListener('visibilitychange', () => { rodando = !document.hidden; });
  tamanho(); quadro();
  if (!reduz) requestAnimationFrame(laco);
})();

// inclinação suave dos cartões
if (!reduz) {
  document.addEventListener('pointermove', e => {
    const n = e.target.closest && e.target.closest('.tilt');
    if (!n || e.pointerType === 'touch') return;
    const r = n.getBoundingClientRect();
    n.style.setProperty('--ry', ((e.clientX - r.left) / r.width - .5) * 6 + 'deg');
    n.style.setProperty('--rx', (.5 - (e.clientY - r.top) / r.height) * 6 + 'deg');
  });
  document.addEventListener('pointerout', e => {
    const n = e.target.closest && e.target.closest('.tilt');
    if (n) { n.style.setProperty('--rx', '0deg'); n.style.setProperty('--ry', '0deg'); }
  });
}

/* ======================= estado e API ======================= */
const S = { token: '', demo: false, user: null, mes: mesAtual(), view: 'jornada', contas: [], cats: [], seq: 0, cseq: 0 };
const configurado = () => !/COLE_AQUI/.test(CONFIG.API_URL) && !/COLE_AQUI/.test(CONFIG.CLIENT_ID);

async function api(acao, dados) {
  if (S.demo) return demo(acao, dados || {});
  let j;
  try {
    const r = await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify({ acao, token: S.token, dados: dados || {} }) });
    j = await r.json();
  } catch (e) { throw new Error('Sem conexão com o servidor. Tente de novo.'); }
  if (!j.ok) {
    const e = new Error(j.mensagem || j.erro || 'Erro');
    e.codigo = j.erro;
    if (j.erro === 'token_invalido' || j.erro === 'nao_autenticado') { sair(); toast('Sua sessão expirou. Entre de novo.', 'erro'); }
    throw e;
  }
  return j.dados;
}

/* ======================= modo demonstração (dados fictícios em memória) ======================= */

  const metas = [{ id: id(), nome: 'Viagem de férias', valorAlvo: 6000, valorAtual: 2200, prazo: somarMes(mesAtual(), 8) + '-15' }, { id: id(), nome: 'Reserva de emergência', valorAlvo: 15000, valorAtual: 3000, prazo: '' }];

})();


/* limites no modo demonstração (mesma regra do back-end) */
function demoNivel(g, l) { const c = Math.round(g * 100), t = Math.round(l * 100); return c > t ? 'excedido' : c === t ? 'atingido' : c * 100 >= t * 80 ? 'aviso' : 'ok'; }
function demoLimites(D, mes) {
  const gastos = D.lanc.filter(l => l.tipo === 'despesa' && l.data.slice(0, 7) === mes);
  return D.limites.map(l => {

function previsaoMeta(m) {
  const falta = Math.max(0, m.valorAlvo - m.valorAtual); if (!falta) return 'Meta atingida! 🎉';
  const partes = [];
  if (m.aporte > 0) { const n = Math.ceil(falta / m.aporte), fim = somarMes(mesAtual(), n); partes.push('Aportando ' + brl(m.aporte) + '/mês: ' + n + ' mese(s), por volta de ' + mesNome(fim, true) + '.'); }
  else partes.push('Defina um aporte mensal para ver a previsão.');
  if (m.prazo) { const [py, pm] = m.prazo.split('-').map(Number), [cy, cm] = mesAtual().split('-').map(Number), meses = (py - cy) * 12 + (pm - cm); if (meses > 0) partes.push('Para chegar no prazo: ' + brl(falta / meses) + '/mês.'); else partes.push('Prazo vencido.'); }
  return partes.join(' ');
}

// Recorte de foto: arrastar para posicionar, controle de zoom, resultado 256×256 JPEG leve.
function recortarFoto(arquivo) {

    const url = URL.createObjectURL(arquivo), img = new Image();

      const N = 280, cv = el('canvas', { width: N, height: N, class: 'crop-cv', 'aria-label': 'Área de recorte da foto' }), g = cv.getContext('2d');
      const base = N / Math.min(img.width, img.height); let zoom = 1, ox = 0, oy = 0;
      const lim = () => { const w = img.width * base * zoom, h = img.height * base * zoom; ox = Math.max(-(w - N) / 2, Math.min((w - N) / 2, ox)); oy = Math.max(-(h - N) / 2, Math.min((h - N) / 2, oy)); };
      const desenha = (alvo, tam) => { lim(); const k = tam / N, w = img.width * base * zoom * k, h = img.height * base * zoom * k; alvo.fillStyle = '#fff'; alvo.fillRect(0, 0, tam, tam); alvo.drawImage(img, tam / 2 - w / 2 + ox * k, tam / 2 - h / 2 + oy * k, w, h); };
      const redesenha = () => desenha(g, N);

      const dlg = el('dialog', { class: 'crop glass', 'aria-label': 'Recortar foto' }, el('h3', null, 'Ajuste sua foto'), el('div', { class: 'crop-box' }, cv, el('i', { class: 'crop-mask', 'aria-hidden': 'true' })),
        el('p', { class: 'small mute', style: 'margin:8px 0' }, 'Arraste para posicionar e use o controle para aproximar.'), zm,
        el('div', { style: 'display:flex;gap:8px;margin-top:14px;justify-content:flex-end' },

      dlg.addEventListener('close', () => { URL.revokeObjectURL(url); const v = dlg.returnValue; dlg.remove(); resolve(v && v.startsWith('data:image/jpeg') ? v : null); });

    el('div', { class: 'card glass reveal' }, el('div', { class: 'row', style: 'display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px' }, el('h3', { style: 'margin:0' }, 'Histórico em reais'), filtros), graf), conv, alertasBox);
  cartoesFav(); detalhe(); alertas();
  api('cambio_verificar_alertas').then(r => avisaAlertas(r.alertas)).catch(() => {});
}

async function vCons(raiz) {
  const orb = el('div', { class: 'orb thinking', role: 'img', 'aria-label': 'Consultor analisando' });
  const saida = el('div', { class: 'lista', style: 'gap:10px;margin-top:8px' });
  const resumo = el('p', { class: 'mute', style: 'text-align:center;margin:8px 0 18px' }, 'Analisando seus números de ', mesNome(S.mes, true), '…');
  const refaz = el('button', { class: 'btn ghost', type: 'button' }, 'Reanalisar');
  raiz.replaceChildren(el('div', { class: 'card glass reveal' }, el('div', { class: 'orbbox' }, orb), resumo, saida, el('div', { style: 'text-align:center;margin-top:16px' }, refaz)));
  const rodar = async () => {
    orb.classList.add('thinking'); saida.replaceChildren();
    const meu = ++S.cseq;
    const [c] = await Promise.all([api('consultor', { mes: S.mes }), new Promise(r => setTimeout(r, reduz ? 0 : 1100))]);
    if (meu !== S.cseq) return;
    orb.classList.remove('thinking');
    resumo.replaceChildren('Em ', mesNome(S.mes, true), ': receitas ', el('b', { class: 'pos' }, brl(c.receitas)), ', despesas ', el('b', { class: 'neg' }, brl(c.despesas)), '.');
    saida.append(...(c.dicas.length ? c.dicas.map(cardDica) : [el('div', { class: 'vazio' }, 'Ainda não há dados suficientes. Registre receitas e despesas para eu poder ajudar.')]));
  };
  refaz.onclick = tentar(rodar);
  rodar().catch(e => { orb.classList.remove('thinking'); resumo.textContent = e.message || 'Não foi possível analisar agora.'; });

/* ======================= navegação ======================= */
async function carregarBase() { [S.contas, S.cats] = await Promise.all([api('listar_contas'), api('listar_categorias')]); }

function marcaNav() {
  const nav = $('#nav'), on = $('button.on', nav), ind = $('#ind');
  if (!on) return;
  ind.style.left = on.offsetLeft + 'px'; ind.style.width = on.offsetWidth + 'px';
  on.scrollIntoView({ inline: 'center', block: 'nearest' });
}
async function ir(v) {
  const antes = S.view; S.view = v || S.view;
  if (v && v !== antes) { scrollTo(0, 0); CB.call('warp'); }
  CB.call('onView', S.view); document.body.classList.toggle('in-app', S.view !== 'jornada');
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.v === S.view));
  marcaNav();
  const meu = ++S.seq, raiz = $('#view');
  raiz.replaceChildren(esqueleto());
  try {
    if (!S.contas.length || !S.cats.length) await carregarBase();
    const tmp = el('div');
    await TELAS[S.view](tmp);
    if (meu !== S.seq) return;
    raiz.replaceChildren(...tmp.childNodes);
    raiz.classList.remove('warp'); void raiz.offsetWidth; raiz.classList.add('warp');
    animar(raiz);
  } catch (e) { if (meu === S.seq) { raiz.replaceChildren(el('div', { class: 'card glass vazio' }, e.message || 'Erro ao carregar.', el('div', { style: 'margin-top:12px' }, el('button', { class: 'btn ghost', onclick: () => ir() }, 'Tentar de novo')))); } }
}
function rotuloMes() {
  $('#mlabel').textContent = mesNome(S.mes, true);
  $('#mnext').disabled = S.mes >= mesAtual();
}

/* ======================= sessão e login ======================= */
function decodificaJWT(t) {
  try { const p = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/'); return JSON.parse(decodeURIComponent(escape(atob(p + '==='.slice((p.length + 3) % 4))))); } catch (e) { return null; }
}
const guarda = (k, v) => { try { v == null ? sessionStorage.removeItem(k) : sessionStorage.setItem(k, v); } catch (e) { /* sem armazenamento */ } };
const le = k => { try { return sessionStorage.getItem(k); } catch (e) { return null; } };

async function entrar(token, emDemo) {
  S.demo = !!emDemo; S.token = token || '';
  try {
    const u = await api('iniciar');
    const jwt = emDemo ? null : decodificaJWT(token);
    S.user = { nome: u.nome || (jwt && jwt.name) || 'Você', email: u.email };
    guarda('rumo_tk', emDemo ? null : token);
    await carregarBase();
    $('#login').hidden = true; $('#shell').hidden = false;
    $('#memail').textContent = S.user.email;
    try {   // foto, apelido e preferências guardadas na conta
      const pf = await api('perfil');
      Object.assign(S.user, { nome: pf.nome || S.user.nome, apelido: pf.apelido, foto: pf.foto });
      if (pf.prefs && Object.keys(pf.prefs).length) { Object.assign(OPT, pf.prefs); try { localStorage.setItem('rumo_opts', JSON.stringify(OPT)); } catch (e) { /* ok */ } opcoesAplicar(); }
    } catch (e) { /* segue sem perfil */ }
    atualizaAvatar();
    S.mes = mesAtual(); rotuloMes();
    if (emDemo) toast('Modo demonstração: os dados são fictícios e somem ao recarregar.');
    await ir('jornada');
  } catch (e) {
    toast(e.message || 'Não foi possível entrar.', 'erro');
    if (!emDemo) mostrarLogin();
  }
}
function mostrarLogin() { CB.call('leaveJourney'); CB.call('setMode', 'login'); scrollTo(0, 0); $('#shell').hidden = true; $('#login').hidden = false; $('#login .box').style.animation = 'none'; void $('#login .box').offsetWidth; $('#login .box').style.animation = ''; }
function sair() {
  S.token = ''; S.user = null; S.contas = []; S.cats = []; S.demo = false; guarda('rumo_tk', null);
  try { if (window.google && google.accounts) google.accounts.id.disableAutoSelect(); } catch (e) { /* ok */ }
  $('#menu').hidden = true; mostrarLogin();
}
function iniciarGoogle() {
  const msg = $('#loginmsg');
  if (!configurado()) { msg.textContent = 'Para entrar com sua conta Google, preencha API_URL e CLIENT_ID no topo do index.html.'; return; }
  let tent = 0;
  (function espera() {
    if (window.google && google.accounts && google.accounts.id) {
      google.accounts.id.initialize({ client_id: CONFIG.CLIENT_ID, callback: r => entrar(r.credential, false), auto_select: false });
      google.accounts.id.renderButton($('#gbtn'), { theme: 'filled_black', size: 'large', shape: 'pill', text: 'continue_with', locale: 'pt-BR', width: 280 });
    } else if (tent++ < 60) setTimeout(espera, 100);
    else msg.textContent = 'Não consegui carregar o login do Google. Verifique a conexão.';
  })();
}

/* ======================= eventos da casca ======================= */
$('#nav').addEventListener('click', e => { const b = e.target.closest('button[data-v]'); if (b) ir(b.dataset.v); });
$('#mprev').onclick = () => { S.mes = somarMes(S.mes, -1); rotuloMes(); ir(); };

$('#ajudaBtn').onclick = () => { $('#menu').hidden = true; $('#avatar').setAttribute('aria-expanded', 'false'); ir('ajuda'); };

});

addEventListener('resize', marcaNav);

/* RUMO e ESC levam à tela inicial (a Jornada). ESC fecha primeiro o que estiver aberto. */
function irInicio() {
  if (S.view !== 'jornada') ir('jornada');
  else { CB.call('home'); scrollTo({ top: 0, behavior: 'smooth' }); }
}
$('#home').addEventListener('click', irInicio);
$('#home').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); irInicio(); } });
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || e.defaultPrevented) return;
  const menu = $('#menu');
  if (!menu.hidden) { menu.hidden = true; $('#avatar').setAttribute('aria-expanded', 'false'); $('#avatar').focus(); return; }
  const dlg = document.querySelector('dialog[open],[role=dialog]:not([hidden]),[aria-modal=true]:not([hidden])');
  if (dlg) { if (dlg.close) dlg.close(); else dlg.hidden = true; return; }
  if ($('#shell').hidden || document.body.classList.contains('diving')) return;
  const t = document.activeElement;
  if (t && t.matches && t.matches('input:not([type=range]):not([type=checkbox]):not([type=color]),textarea,select')) { t.blur(); return; }
  irInicio();
});

/* ======================= início ======================= */
(function partida() {
  iniciarGoogle();
  const tk = le('rumo_tk'), jwt = tk && decodificaJWT(tk);
  if (jwt && jwt.exp * 1000 > Date.now() + 60000 && configurado()) { entrar(tk, false); }
  else { guarda('rumo_tk', null); $('#login').hidden = false; }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { /* sem PWA offline */ });
  if (new URLSearchParams(location.search).has('demo')) entrar('', true);
})();
